name: fgc-v3-e2e

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: content_pipeline
      POSTGRES_PASSWORD: content_pipeline
      POSTGRES_DB: content_pipeline
    volumes:
      - fgc_e2e_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api-runtime
    command: sh -lc "pnpm db:migrate && pnpm start"
    environment:
      DATABASE_URL: postgres://content_pipeline:content_pipeline@postgres:5432/content_pipeline
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 3000
    # Readiness: exact HTTP 200 + {"status":"ok"} from GET /health. The route
    # is the existing registerHealthRoutes response shape. The check refuses
    # to accept any other status.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"fetch('http://localhost:3000/health').then(async (r) => { if (r.status !== 200) { process.exit(1) } const body = await r.json().catch(() => ({})); process.exit(body && body.status === 'ok' ? 0 : 1) }).catch(() => process.exit(1))\""
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  web-gateway:
    build:
      context: .
      target: web-gateway
    # Readiness: Nginx must serve the React app shell (exact 200 on /) and
    # proxy a safe API read through to the API (exact 200 on
    # /collector/content-categories returning {"items":[...]}). Both checks
    # must pass.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -q -O- http://localhost:80/ | grep -q 'id=\"root\"' && wget -q -O- http://localhost:80/collector/content-categories | grep -q '\"items\"' || exit 1"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy

  e2e-runner:
    build:
      context: .
      target: e2e-runtime
    init: true
    command: ["sh", "scripts/run-e2e-runner-container.sh"]
    environment:
      E2E_GATEWAY_URL: http://web-gateway
    depends_on:
      - postgres
      - api
      - web-gateway

volumes:
  fgc_e2e_postgres_data:

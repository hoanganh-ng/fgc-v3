name: fgc-v3-e2e

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: content_pipeline
      POSTGRES_PASSWORD: content_pipeline
      POSTGRES_DB: content_pipeline
    volumes:
      - fgc_e2e_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api-runtime
    command: sh -lc "pnpm db:migrate && pnpm start"
    environment:
      DATABASE_URL: postgres://content_pipeline:content_pipeline@postgres:5432/content_pipeline
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 3000
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  web-gateway:
    build:
      context: .
      target: web-gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:80/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      api:
        condition: service_healthy

  e2e-runner:
    build:
      context: .
      target: e2e-runtime
    init: true
    command: ["sh", "scripts/run-e2e-runner-container.sh"]
    environment:
      E2E_GATEWAY_URL: http://web-gateway
    depends_on:
      - postgres
      - api
      - web-gateway

volumes:
  fgc_e2e_postgres_data: